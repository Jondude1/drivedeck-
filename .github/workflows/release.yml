name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          if ! ./gradlew assembleRelease --stacktrace > build.log 2>&1; then
            # Surface the real error as a public annotation so failures are easy to read.
            MSG=$(grep -nE "^e: |What went wrong|^> |Caused by|error:|FAILED" build.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${MSG}"
            tail -80 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DriveDeck-v1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DriveDeck v1.0.${{ github.run_number }}
          files: DriveDeck-v1.0.${{ github.run_number }}.apk
          make_latest: true
